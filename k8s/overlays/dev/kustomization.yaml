apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devops-dev
resources:
  - ../../base
  - httproute.yaml

labels:
  - pairs:
      environment: dev

replicas:
  - name: api-gateway
    count: 1
  - name: user-service
    count: 1
  - name: task-service
    count: 1
  - name: notification-service
    count: 1
  - name: frontend
    count: 1