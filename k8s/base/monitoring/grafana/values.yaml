adminUser: admin

adminPassword: admin123

service:
  type: ClusterIP

persistence:
  enabled: true
  size: 300Mi

podSecurityContext:
  fsGroup: 472

securityContext:
  runAsUser: 472
  runAsGroup: 472
  runAsNonRoot: true

initChownData:
  enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards

dashboards:
  default:
    platform-overview:
      file: dashboards/platform-overview.json

    api-gateway:
      file: dashboards/api-gateway.json

    service-overview:
      file: dashboards/service-overview.json

    kubernetes-cluster-overview:
      file: dashboards/kubernetes-cluster-overview.json