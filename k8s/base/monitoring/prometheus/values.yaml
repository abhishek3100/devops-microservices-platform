extraScrapeConfigs: |
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway.devops-platform.svc.cluster.local:3000

  - job_name: user-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - user-service.devops-platform.svc.cluster.local:4000

  - job_name: task-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - task-service.devops-platform.svc.cluster.local:8000

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - notification-service.devops-platform.svc.cluster.local:8000