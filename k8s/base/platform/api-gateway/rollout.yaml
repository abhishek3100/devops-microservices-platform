apiVersion: apps/v1
kind: Rollout
metadata:
  name: api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    canary:
    stableService: api-gateway-stable
    canaryService: api-gateway-canary
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 50
      - pause:
          duration: 30s
      - setWeight: 100
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/abhishek3100/devops-microservices-platform/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
          - name: PROTO_PATH
            value: /app/proto/task.proto
          envFrom:
            - configMapRef:
                name: platform-config
          resources:
            requests:
              cpu: "20m"
              memory: "128Mi"
            limits:
              cpu: "50m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false