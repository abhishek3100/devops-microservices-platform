apiVersion: batch/v1
kind: Job
metadata:
  name: postsync-health
  namespace: devops-platform
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: health
          image: curlimages/curl:8.8.0
          command:
            - sh
            - -c
            - |
              curl -f http://api-gateway:3000/health