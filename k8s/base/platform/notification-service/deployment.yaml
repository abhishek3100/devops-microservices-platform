apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: notification-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/abhishek3100/devops-microservices-platform/notification-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50052
          envFrom:
            - configMapRef:
                name: platform-config
          resources:
            requests:
              cpu: 30m
              memory: 128Mi
            limits:
              cpu: 50m
              memory: 256Mi
          startupProbe:
            grpc:
              port: 50052
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 8
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001