apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: devops-platform
  namespace: argocd

spec:
  project: platform
  source:
    repoURL: https://github.com/abhishek3100/devops-microservices-platform.git
    targetRevision: main
    path: k8s/overlays/local

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true